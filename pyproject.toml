[build-system]
requires = ["setuptools>=77", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "penumbria-fastlabelops"
version = "0.1.0"
description = "Focused fast 3D label operations for Penumbria"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/ajinkya-kulkarni/penumbria_fastlabelops"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "scipy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
